name: healthcare_app
description: "SignCare - AI 기반 개인 맞춤형 헬스케어 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^16.2.1
  
  # Local Database
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0
  ffi: ^2.1.3
  
  # Network
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  web_socket_channel: ^3.0.3
  
  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  
  # UI/UX
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.11.1
  
  # Charts and Data Visualization
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^31.1.17
  
  # Health & Sensors
  health: ^13.1.0
  permission_handler: ^12.0.0+1
  
  # Camera & Image
  camera: ^0.11.1
  image_picker: ^1.1.2
  image: ^4.2.0
  
  # ML/AI (ultralytics_yolo 임시 제거 - Java 17 요구사항으로 인한 빌드 오류)
  # ultralytics_yolo: ^0.1.26
  
  # Social Login
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  
  # Weather API
  http: ^1.2.2
  geolocator: ^14.0.1
  
  # OCR and Text Recognition (temporarily disabled - need to decide on implementation)
  # Options: Google ML Kit, Azure Computer Vision, or server-side processing
  # google_mlkit_text_recognition: ^0.15.0
  # google_mlkit_barcode_scanning: ^0.14.1
  # tflite_flutter: ^0.11.0
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  uuid: ^4.4.2
  flutter_dotenv: ^5.1.0

  # Logging
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  json_serializable: ^6.9.5
  freezed: ^3.0.6
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.0.0
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/
    - assets/lottie/
    - assets/nutrition/
    - .env
  
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/to_be_converted_icon.png"
  min_sdk_android: 21

